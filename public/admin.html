<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BAZAR HUB Admin</title><link rel="stylesheet" href="/admin.css"></head><body><header><a href="/">← BAZAR HUB</a><h1>Admin Dashboard</h1><button id="logout" class="hidden">Logout</button></header><main><section id="loginBox" class="panel"><h2>অ্যাডমিন লগইন</h2><form id="loginForm"><label>Username<input name="username" required></label><label>Password<input name="password" type="password" required></label><button>লগইন</button><p id="loginMsg"></p></form></section><section id="dashboard" class="hidden"><div class="tabs"><button data-tab="orders">অর্ডার</button><button data-tab="products">পণ্য</button></div><section id="ordersTab" class="panel"><h2>সাম্প্রতিক অর্ডার</h2><div id="orders"></div></section><section id="productsTab" class="panel hidden"><h2>নতুন পণ্য যোগ করুন</h2><form id="productForm" enctype="multipart/form-data"><label>পণ্যের নাম<input name="name" required></label><label>ক্যাটাগরি<select name="category"><option>টি-শার্ট</option><option>প্যান্ট</option><option>শীতের পোশাক</option><option>ঘড়ি</option></select></label><label>বিবরণ<textarea name="description"></textarea></label><label>দাম (৳)<input name="price" type="number" min="0" required></label><label>স্টক<input name="stock" type="number" min="0" required></label><label>সাইজ (কমা দিয়ে লিখুন)<input name="sizes" placeholder="S,M,L,XL"></label><label>কালার (কমা দিয়ে লিখুন)<input name="colors" placeholder="কালো,সাদা"></label><label>ছবি (JPG/PNG/WEBP, সর্বোচ্চ ৩MB)<input name="image" type="file" accept="image/jpeg,image/png,image/webp"></label><button>পণ্য যোগ করুন</button><p id="productMsg"></p></form><h2>পণ্যের তালিকা</h2><div id="productList"></div></section></section></main><script src="/admin.js"></script></body></html>
